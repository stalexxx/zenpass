[package]
name = "zkpm-backend"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.1"
# Matches the sibling crypto-core declaration; internal crate, not published.
license = "Apache-2.0"
publish = false

# Isolate backend dependency resolution from the approved root crypto workspace.
[workspace]
resolver = "3"

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "matched-path", "tokio"] }
base64 = { version = "=0.22.1", default-features = false, features = ["std"] }
clap = { version = "=4.6.6", default-features = false, features = ["derive", "error-context", "help", "std", "suggestions", "usage"] }
crypto-core = { path = "../../crates/crypto-core", version = "=0.1.0" }
secrecy = "=0.10.3"
serde = { version = "=1.0.229", features = ["derive"] }
sqlx = { version = "=0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "migrate", "macros"] }
thiserror = "=2.0.20"
time = { version = "=0.3.55", default-features = false, features = ["formatting", "parsing", "std"] }
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
tower-http = { version = "=0.7.1", default-features = false, features = ["cors", "timeout"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "json", "registry", "std"] }
uuid = { version = "=1.26.0", default-features = false, features = ["v4"] }

[dev-dependencies]
http-body-util = "=0.1.4"
serde_json = "=1.0.151"
tower = { version = "=0.5.3", features = ["util"] }
uuid = { version = "=1.26.0", default-features = false, features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"
