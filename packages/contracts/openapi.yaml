openapi: 3.1.0
info:
  title: Pass zero-knowledge API
  version: 1.0.0
  description: The service stores opaque client-encrypted data only.
servers:
  - url: https://api.pass.example/v1
paths:
  /auth/opaque/register:
    post:
      operationId: opaqueRegister
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OpaqueRegisterRequest' } } } }
      responses: { '201': { description: Registered, content: { application/json: { schema: { $ref: '#/components/schemas/OpaqueMessage' } } } }, '400': { $ref: '#/components/responses/BadRequest' } }
  /auth/opaque/login:
    post:
      operationId: opaqueLogin
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/OpaqueLoginRequest' } } } }
      responses: { '200': { description: Login continuation or completed session, content: { application/json: { schema: { oneOf: [{ $ref: '#/components/schemas/OpaqueMessage' }, { $ref: '#/components/schemas/Session' }] } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /auth/refresh:
    post: { operationId: refresh, responses: { '200': { $ref: '#/components/responses/Session' }, '401': { $ref: '#/components/responses/Unauthorized' } } }
  /auth/logout:
    post: { operationId: logout, security: [{ bearerAuth: [] }], responses: { '204': { description: Logged out } } }
  /account/key-bundle:
    get:
      operationId: getKeyBundle
      security: [{ bearerAuth: [] }]
      responses: { '200': { $ref: '#/components/responses/KeyBundle' }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '404': { $ref: '#/components/responses/NotFound' } }
    put:
      operationId: replaceKeyBundle
      security: [{ bearerAuth: [] }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/KeyBundle' } } } }
      responses: { '204': { description: Replaced }, '400': { $ref: '#/components/responses/BadRequest' }, '401': { $ref: '#/components/responses/Unauthorized' }, '409': { $ref: '#/components/responses/KeyBundleConflict' }, '413': { $ref: '#/components/responses/BadRequest' } }
  /account/recovery-reset:
    post: { operationId: recoveryReset, security: [{ bearerAuth: [] }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RecoveryResetRequest' } } } }, responses: { '204': { description: Reset complete }, '401': { $ref: '#/components/responses/Unauthorized' } } }
  /account/delete:
    post: { operationId: deleteAccount, security: [{ bearerAuth: [] }], responses: { '202': { description: Deletion scheduled } } }
  /devices:
    get: { operationId: listDevices, security: [{ bearerAuth: [] }], responses: { '200': { description: Devices, content: { application/json: { schema: { type: object, required: [devices], properties: { devices: { type: array, items: { $ref: '#/components/schemas/Device' } } } } } } } } }
    post: { operationId: registerDevice, security: [{ bearerAuth: [] }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/DeviceCreate' } } } }, responses: { '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/Device' } } } } } }
  /devices/{deviceId}/revoke:
    post: { operationId: revokeDevice, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/deviceId' }], responses: { '204': { description: Revoked }, '404': { $ref: '#/components/responses/NotFound' } } }
  /vaults/{vaultId}/items:
    post: { operationId: mutateItem, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/vaultId' }], requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/Mutation' } } } }, responses: { '201': { description: Committed, content: { application/json: { schema: { $ref: '#/components/schemas/ItemRecord' } } } }, '409': { $ref: '#/components/responses/Conflict' } } }
  /vaults/{vaultId}/changes:
    get: { operationId: listChanges, security: [{ bearerAuth: [] }], parameters: [{ $ref: '#/components/parameters/vaultId' }, { name: cursor, in: query, required: false, schema: { type: string, minLength: 1 } }, { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }], responses: { '200': { description: Changes, content: { application/json: { schema: { $ref: '#/components/schemas/ChangePage' } } } } } }
components:
  securitySchemes: { bearerAuth: { type: http, scheme: bearer, bearerFormat: opaque-session } }
  parameters:
    vaultId: { name: vaultId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    deviceId: { name: deviceId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
  responses:
    BadRequest: { description: Invalid request, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    Unauthorized: { description: Authentication failed, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    NotFound: { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } } }
    Conflict: { description: Revision conflict, content: { application/json: { schema: { $ref: '#/components/schemas/Conflict' } } } }
    Session: { description: Session, content: { application/json: { schema: { $ref: '#/components/schemas/Session' } } } }
    KeyBundle: { description: Opaque key bundle, content: { application/json: { schema: { $ref: '#/components/schemas/KeyBundle' } } } }
    KeyBundleConflict: { description: Key-bundle publication revision conflict, content: { application/json: { schema: { $ref: '#/components/schemas/KeyBundleConflict' } } } }
  schemas:
    Id: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$' }
    DateTime: { type: string, format: date-time }
    OpaqueMessage: { type: object, additionalProperties: false, required: [message], properties: { message: { type: string, minLength: 1 } } }
    OpaqueRegisterRequest: { type: object, additionalProperties: false, required: [accountId, clientMessage], properties: { accountId: { $ref: '#/components/schemas/Id' }, clientMessage: { type: string, minLength: 1 } } }
    OpaqueLoginRequest: { type: object, additionalProperties: false, required: [accountId, clientMessage], properties: { accountId: { $ref: '#/components/schemas/Id' }, clientMessage: { type: string, minLength: 1 } } }
    Session: { type: object, additionalProperties: false, required: [accessToken, expiresAt], properties: { accessToken: { type: string, minLength: 1 }, expiresAt: { $ref: '#/components/schemas/DateTime' } } }
    KeyBundle: { type: object, additionalProperties: false, required: [bundle, version], properties: { bundle: { type: string, pattern: '^b64:[A-Za-z0-9+/]+={0,2}$' }, version: { type: integer, minimum: 1, maximum: 2147483647 } } }
    KeyBundleConflict: { type: object, additionalProperties: false, required: [error, currentVersion, attemptedVersion], properties: { error: { const: key_bundle_conflict }, currentVersion: { type: [integer, 'null'], minimum: 1, maximum: 2147483647 }, attemptedVersion: { type: integer, minimum: 1, maximum: 2147483647 } } }
    RecoveryResetRequest: { type: object, additionalProperties: false, required: [recoveryProof, keyBundle], properties: { recoveryProof: { type: string, minLength: 1 }, keyBundle: { $ref: '#/components/schemas/KeyBundle' } } }
    DeviceCreate:
      oneOf:
        - $ref: '#/components/schemas/DeviceCreateLegacyPublicKey'
        - $ref: '#/components/schemas/DeviceCreateBearerSession'
    DeviceCreateLegacyPublicKey: { type: object, additionalProperties: false, required: [name, publicKey], properties: { name: { type: string, minLength: 1, maxLength: 128 }, publicKey: { type: string, minLength: 1 } } }
    DeviceCreateBearerSession: { type: object, additionalProperties: false, required: [name, enrollmentMode], properties: { name: { type: string, minLength: 1, maxLength: 128 }, enrollmentMode: { const: bearer-session-v1 } } }
    Device: { type: object, additionalProperties: false, required: [deviceId, name, createdAt, lastSeenAt, revokedAt], properties: { deviceId: { $ref: '#/components/schemas/Id' }, name: { type: string }, createdAt: { $ref: '#/components/schemas/DateTime' }, lastSeenAt: { type: [string, 'null'], format: date-time }, revokedAt: { type: [string, 'null'], format: date-time } } }
    ItemRecord: { type: object, additionalProperties: false, required: [itemId, vaultId, ciphertext, envelopeVersion, revision, deleted, createdAt, updatedAt], properties: { itemId: { $ref: '#/components/schemas/Id' }, vaultId: { $ref: '#/components/schemas/Id' }, ciphertext: { type: string, pattern: '^b64:[A-Za-z0-9+/]+={0,2}$' }, envelopeVersion: { const: crypto-envelope/v1 }, revision: { type: integer, minimum: 1 }, deleted: { type: boolean }, createdAt: { $ref: '#/components/schemas/DateTime' }, updatedAt: { $ref: '#/components/schemas/DateTime' } } }
    Mutation: { type: object, additionalProperties: false, required: [mutationId, itemId, vaultId, baseRevision, ciphertext, envelopeVersion, deleted], properties: { mutationId: { $ref: '#/components/schemas/Id' }, itemId: { $ref: '#/components/schemas/Id' }, vaultId: { $ref: '#/components/schemas/Id' }, baseRevision: { type: integer, minimum: 0 }, ciphertext: { type: string, pattern: '^b64:[A-Za-z0-9+/]+={0,2}$' }, envelopeVersion: { const: crypto-envelope/v1 }, deleted: { type: boolean } } }
    ChangePage: { type: object, additionalProperties: false, required: [changes, nextCursor], properties: { changes: { type: array, items: { $ref: '#/components/schemas/ItemRecord' } }, nextCursor: { type: [string, 'null'], minLength: 1 } } }
    Conflict: { type: object, additionalProperties: false, required: [error, mutationId, current, attempted], properties: { error: { const: conflict }, mutationId: { $ref: '#/components/schemas/Id' }, current: { $ref: '#/components/schemas/ItemRecord' }, attempted: { $ref: '#/components/schemas/Mutation' } } }
    ApiError: { type: object, additionalProperties: false, required: [error, message, requestId], properties: { error: { type: string }, message: { type: string }, requestId: { type: string } } }
