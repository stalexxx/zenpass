services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pass
      POSTGRES_USER: pass
      POSTGRES_PASSWORD: pass
    ports: ["5432:5432"]
    volumes: ["pass-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pass -d pass"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://pass:pass@postgres:5432/pass
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
volumes:
  pass-postgres:
