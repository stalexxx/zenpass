services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pass
      POSTGRES_USER: pass
      POSTGRES_PASSWORD: pass
    ports: ["5434:5432"]
    volumes: ["pass-postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pass -d pass"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://pass:pass@postgres:5432/pass
    ports: ["3000:3000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/health/ready').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
  migrate:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    command: ["bun", "src/migrate.mjs"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://pass:pass@postgres:5432/pass
    depends_on:
      postgres: { condition: service_healthy }
volumes:
  pass-postgres:
