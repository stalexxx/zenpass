name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - run: corepack pnpm install --frozen-lockfile
      - run: pnpm check:boundaries
      - run: pnpm test
      - run: pnpm build
      - run: cargo fmt --all -- --check
